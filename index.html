<style>

.tx{background:none;border:0;color:var(--mute);font-family:inherit;font-weight:600;font-size:.85rem;padding:6px 0;cursor:pointer}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

.sl{display:flex;gap:12px;align-items:center}.sl input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}.sl input[type=number]{width:88px;flex:none;text-align:center}
input[type=number],input[type=text],input[type=password],input[type=email],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:0;border-radius:14px;padding:12px 14px;width:100%;min-width:0;max-width:100%;display:block}

input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}

.step{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:18px;padding:4px}
.step button{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.step input{background:none;text-align:center;font-size:1.3rem;font-weight:800;padding:8px 0;min-width:0;border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}

.chips7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.rowsw{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 0;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer;text-align:left}
.rowsw:last-child{border-bottom:0}
.fold-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:2px 0;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left}
.fold-hd .eyebrow{margin:0}
.fold-meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.78rem;font-weight:600;flex:none}

.fold-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tg{width:46px;height:28px;border-radius:14px;background:var(--soft);position:relative;flex:none;transition:.15s;box-shadow:inset 0 0 0 1px var(--line)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(18px);background:#15171a}
.ex{background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);border:2px solid transparent}
.ex.act{border-color:var(--acc)}.ex.done{opacity:.55}.ex.done:has(.sp.ed){opacity:1}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sp{min-width:34px;height:34px;padding:0 11px;border-radius:17px;display:grid;place-items:center;font-size:.82rem;font-weight:700;background:var(--acc);color:var(--on)}

.sp.ed{outline:2px solid var(--ink);outline-offset:2px}
.sp.o{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute)}
.edit{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tags span{background:var(--soft);border-radius:10px;padding:4px 10px;font-size:.8rem;font-weight:600}
.rx{font-size:1.15rem;font-weight:600;margin:8px 0 0;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:9px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}.ch{width:100%;height:auto;display:block}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}.kv div:last-child{border:0}.kv span{color:var(--mute)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),420px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--tb);border-radius:28px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:5;touch-action:none}
.tab-pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);background:var(--acc);border-radius:22px;transform-origin:50% 50%;will-change:transform;pointer-events:none;z-index:0}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--tf);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:22px;font-family:inherit;cursor:pointer;transition:color .24s ease,transform .2s ease;touch-action:none}
.tabs button.on{color:var(--on)}.tabs.scrubbing button.on{transform:scale(1.06)}.tabs em{font-style:normal;font-size:.68rem;font-weight:700}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),420px);background:var(--acc);color:var(--on);border-radius:20px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;z-index:6;box-shadow:0 10px 26px rgba(0,0,0,.25)}

.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800;text-transform:uppercase}

.sheet.open{transform:none}.sheet .wrap{padding-top:18px;padding-bottom:40px}

.sheet-in{animation:sIn .28s cubic-bezier(.22,1,.36,1)}@keyframes sIn{from{opacity:0;transform:translate3d(28px,0,0)}to{opacity:1;transform:none}}

.mplus{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}.mplus .ic{width:16px;height:16px}
.frow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.frow .rowsw{flex:1;min-width:0;border-bottom:0}.frow .dchip{flex:none;padding:9px 12px;font-size:.8rem}.fplus{flex:none;white-space:nowrap;padding:9px 12px!important;font-size:.8rem;background:var(--acc)!important;color:var(--on)!important}
.formula{font:600 1.02rem/1.5 ui-serif,Georgia,serif;background:var(--soft);border-radius:14px;padding:12px 14px;margin:10px 0 6px;text-align:center;letter-spacing:.01em}
.ck{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;margin-right:10px}.ck.on{background:var(--acc);box-shadow:inset 0 0 0 2px var(--ink)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),420px);background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;z-index:6;box-shadow:0 10px 26px rgba(0,0,0,.25)}.selbar span{flex:1;font-weight:700;font-size:.9rem}.selbar .btn{width:auto;margin:0;padding:10px 16px}.selbar .btn:disabled{opacity:.4}

.shops{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.shops .dchip{flex:none;padding:10px 13px}.swr{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:end}.wl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.wl:last-child{border-bottom:0}.wl>div:first-child{flex:1;min-width:0}.cnt{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:12px;padding:3px;flex:none}.cnt button{width:30px;height:30px;border:0;background:var(--card);color:var(--ink);border-radius:9px;cursor:pointer;display:grid;place-items:center}.cnt .ic{width:16px;height:16px}.cnt b{min-width:22px;text-align:center;font-size:.9rem}.rowbtns{display:flex;gap:8px;flex-wrap:wrap}.rowbtns .btn{flex:1 1 150px;width:auto;margin-top:10px}.acts{display:flex;gap:14px}

let lastTouchEnd=0;

 if(now-lastTouchEnd<=300)e.preventDefault();

function morphPill(pill,fromPos,toIdx,startSx=1,startSy=1){
 if(!pill)return;
 if(pillAnim){try{pillAnim.cancel()}catch(e){}pillAnim=null}
 const endTf=`translate3d(${toIdx*100}%,0,0) scale3d(1,1,1)`;
 if((Math.abs(fromPos-toIdx)<0.001&&Math.abs(startSx-1)<0.001)||fromPos<0||!pill.animate){
  pill.style.transform=endTf;
  return;
 }
 const right=toIdx>=fromPos,dist=toIdx-fromPos,steps=32,frames=[];
 for(let i=0;i<=steps;i++){
  const u=i/steps;
  const lead=u>=1?1:1-Math.exp(-6.2*u)*Math.cos(3.3*u);
  const td=u<=.16?0:(u-.16)/.84;
  const trail=u>=1?1:td<=0?0:1-Math.exp(-5.6*td)*Math.cos(2.6*td);
  const L=fromPos+dist*(right?trail:lead);
  const R=fromPos+1+dist*(right?lead:trail);
  const stretchW=Math.max(.9,R-L);
  const easeOut=Math.pow(1-u,3);
  const w=stretchW+(startSx-1)*easeOut;
  const stretchSy=1-Math.min(.14,Math.max(0,(w-1)*.17));
  const sy=stretchSy+(startSy-1)*easeOut;
  frames.push({transform:`translate3d(${(L*100).toFixed(2)}%,0,0) scale3d(${w.toFixed(4)},${sy.toFixed(4)},1)`});
 }
 pill.style.transform=endTf;
 pillAnim=pill.animate(frames,{duration:540,easing:'linear'});
 pillAnim.onfinish=()=>{pillAnim=null};
}

let scrub={active:false,dragging:false,pid:null,startX:0,startY:0,targetPos:0,pos:0,vel:0,sx:1,sy:1,lastHover:-1,raf:null};
let suppressClickUntil=0;

function bindTabScrub(){
 const nav=$('.tabs');
 if(!nav||nav.dataset.bound)return;
 nav.dataset.bound='1';

 const getMetrics=()=>{
  const r=nav.getBoundingClientRect();
  const pad=6;
  const slotW=Math.max(1,(r.width-pad*2)/TN);
  return{left:r.left+pad,slotW};
 };

 const posFromX=clientX=>{
  const{left,slotW}=getMetrics();
  return Math.max(0,Math.min(TN-1,(clientX-left-slotW/2)/slotW));
 };

 const applyVisual=(pos,sx,sy)=>{
  const pill=$('.tab-pill');
  if(pill){
   if(pillAnim){try{pillAnim.cancel()}catch(e){}pillAnim=null}
   pill.style.transform=`translate3d(${(pos*100).toFixed(2)}%,0,0) scale3d(${sx.toFixed(4)},${sy.toFixed(4)},1)`;
  }
  const hoverIdx=Math.max(0,Math.min(TN-1,Math.round(pos)));
  nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===hoverIdx));
  return hoverIdx;
 };

 const tickScrub=()=>{
  if(!scrub.dragging){scrub.raf=null;return}
  const diff=scrub.targetPos-scrub.pos;
  scrub.vel=scrub.vel*0.58+diff*0.36;
  scrub.pos+=scrub.vel;
  if(Math.abs(diff)<0.0005&&Math.abs(scrub.vel)<0.0005){
   scrub.pos=scrub.targetPos;
   scrub.vel=0;
  }
  const stretch=Math.min(.22,Math.abs(scrub.vel)*1.15);
  scrub.sx=1.06+stretch;
  scrub.sy=1.06-stretch*.42;
  const hoverIdx=applyVisual(scrub.pos,scrub.sx,scrub.sy);
  if(hoverIdx!==scrub.lastHover){
   scrub.lastHover=hoverIdx;
   try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
   const nextTab=TABS[hoverIdx];
   if(nextTab&&nextTab!==tab)switchTab(nextTab,true);
  }
  scrub.raf=requestAnimationFrame(tickScrub);
 };

 const engageDrag=clientX=>{
  if(scrub.dragging)return;
  scrub.dragging=true;
  nav.classList.add('scrubbing');
  const curIdx=Math.max(0,TABS.indexOf(tab));
  scrub.pos=curIdx;
  scrub.targetPos=clientX!=null?posFromX(clientX):curIdx;
  scrub.vel=0;
  scrub.lastHover=curIdx;
  try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
  if(!scrub.raf)scrub.raf=requestAnimationFrame(tickScrub);
 };

 nav.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  if(scrub.raf){cancelAnimationFrame(scrub.raf);scrub.raf=null}
  const curIdx=Math.max(0,TABS.indexOf(tab));
  scrub={
   active:true,
   dragging:false,
   pid:e.pointerId,
   startX:e.clientX,
   startY:e.clientY,
   targetPos:curIdx,
   pos:curIdx,
   vel:0,
   sx:1,
   sy:1,
   lastHover:curIdx,
   raf:null
  };
  try{nav.setPointerCapture(e.pointerId)}catch(err){}
  const pill=$('.tab-pill');
  if(pill&&!pillAnim){
   pill.style.transform=`translate3d(${curIdx*100}%,0,0) scale3d(0.95,0.95,1)`;
  }
 });

 nav.addEventListener('pointermove',e=>{
  if(!scrub.active||e.pointerId!==scrub.pid)return;
  if(!scrub.dragging){
   const dx=Math.abs(e.clientX-scrub.startX);
   const dy=Math.abs(e.clientY-scrub.startY);
   if(dx>8&&dx>=dy){
    engageDrag(e.clientX);
   }
   return;
  }
  e.preventDefault();
  scrub.targetPos=posFromX(e.clientX);
 });

 const finishScrub=e=>{
  if(!scrub.active||(e&&e.pointerId!==scrub.pid))return;
  if(scrub.raf){cancelAnimationFrame(scrub.raf);scrub.raf=null}
  try{nav.releasePointerCapture(scrub.pid)}catch(err){}
  const wasDragging=scrub.dragging;
  const fromPos=scrub.pos;
  const fromSx=scrub.sx;
  const fromSy=scrub.sy;
  scrub.active=false;
  scrub.dragging=false;
  nav.classList.remove('scrubbing');

  if(wasDragging){
   suppressClickUntil=Date.now()+350;
   const finalIdx=Math.max(0,Math.min(TN-1,Math.round(fromPos)));
   const finalTab=TABS[finalIdx];
   morphPill($('.tab-pill'),fromPos,finalIdx,fromSx,fromSy);
   if(finalTab&&finalTab!==tab){
    switchTab(finalTab,true);
   }else{
    nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===Math.max(0,TABS.indexOf(tab))));
   }
  }else{
   const curIdx=Math.max(0,TABS.indexOf(tab));
   const pill=$('.tab-pill');
   if(pill&&!pillAnim){
    pill.style.transform=`translate3d(${curIdx*100}%,0,0) scale3d(1,1,1)`;
   }
   // With pointer capture on the bar, browsers send the click to the bar rather than the button, so handle the tap here.
   if(e&&e.type==='pointerup'){
    const hit=document.elementFromPoint(e.clientX,e.clientY),btn=hit&&hit.closest&&hit.closest('.tabs button');
    if(btn&&btn.dataset.tab)switchTab(btn.dataset.tab,false);
   }
  }
 };

 nav.addEventListener('pointerup',finishScrub);
 nav.addEventListener('pointercancel',finishScrub);
}

function shell(h,fromScrub=false){
 const app=$('#app'),idx=Math.max(0,TABS.indexOf(tab));
 let stage=$('.view-stage');
 if(!stage){
  app.innerHTML=`<div class="top-bar"><div class="brand"><i></i>SetOrder<span id="sync" style="margin-left:auto;font-weight:600;font-size:.72rem;color:var(--mute)"></span><button class="signout-top" data-a="out" type="button">Sign out</button></div></div><div class="view-stage"><div class="view-pane"><div class="pane-inner">${h}</div></div></div><nav class="tabs"><div class="tab-pill" style="transform:translate3d(${idx*100}%,0,0)"></div>${[['day','Today',I.today],['food','Food',I.food],['plan','Plan',I.plan],['prog','Progress',I.prog],['me','Me',I.me]].map(([k,l,i])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${i}<em>${l}</em></button>`).join('')}</nav>`;
  renderedTab=tab;
  bindTabScrub();
  updSync();
  return;
 }

 const oldIdx=TABS.indexOf(renderedTab);
 const changed=renderedTab!==null&&renderedTab!==tab;
 document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===idx));

 if(!fromScrub){
  if(changed)morphPill($('.tab-pill'),oldIdx,idx);
  else{
   const pill=$('.tab-pill');
   if(pill&&!pillAnim)pill.style.transform=`translate3d(${idx*100}%,0,0) scale3d(1,1,1)`;
  }
 }

 if(slideCleanup){slideCleanup();slideCleanup=null}
 stage.querySelectorAll('.view-pane.out').forEach(el=>el.remove());

 const prevScroll=window.scrollY||document.documentElement.scrollTop||0;
 const oldPane=stage.querySelector('.view-pane');
 const newPane=document.createElement('div');
 newPane.className='view-pane';
 newPane.innerHTML=`<div class="pane-inner">${h}</div>`;

 if(changed&&oldPane){
  const dir=idx>oldIdx?1:-1;
  oldPane.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  oldPane.classList.add('out');
  oldPane.style.top=(-prevScroll)+'px';
  window.scrollTo(0,0);

  oldPane.style.transform='translate3d(0,0,0)';
  newPane.style.transform=`translate3d(${dir*100}%,0,0)`;

  stage.appendChild(newPane);
  void newPane.offsetWidth;

  let done=false;
  const finish=()=>{
   if(done)return;
   done=true;
   oldPane.remove();
   newPane.classList.remove('anim');
   newPane.style.transform='';
   slideCleanup=null;
  };

  const tid=setTimeout(finish,600);
  slideCleanup=()=>{clearTimeout(tid);finish()};

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   if(done)return;
   oldPane.classList.add('anim');
   newPane.classList.add('anim');
   oldPane.style.transform=`translate3d(${-dir*100}%,0,0)`;
   newPane.style.transform='translate3d(0,0,0)';
  }));
 }else{
  stage.innerHTML='';
  stage.appendChild(newPane);
  window.scrollTo(0,prevScroll);
 }

 renderedTab=tab;
 bindTabScrub();
 updSync();
}

function sheet(html,kind){let s=$('#sheet');stopScan();

  s.innerHTML=html;void s.offsetWidth;requestAnimationFrame(()=>{s.classList.add('open');sc.classList.add('open')})}
 else if(s.dataset.k!==kind){s.innerHTML=html;s.scrollTop=0;const w=s.firstElementChild;if(w)w.classList.add('sheet-in')}
 else{const st=s.scrollTop;s.innerHTML=html;s.scrollTop=st}

const ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
function loadZX(){if(window.ZXingBrowser)return Promise.resolve();return ZXP=ZXP||new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=ZX_URL;sc.onload=ok;sc.onerror=()=>{ZXP=null;no(new Error('load'))};document.head.appendChild(sc)})}
function stopScan(){scanTok++;if(scanCtl){try{scanCtl.stop()}catch(e){}scanCtl=null}}
async function startScan(){const box=$('#fscan');if(!box)return;stopScan();const tok=scanTok;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){box.innerHTML='<p class="warn">This browser cannot use the camera here. Type the barcode instead.</p>';return}
 box.innerHTML=`<div class="scanbox"><video id="fvid" playsinline muted autoplay></video><i></i></div><p class="m c" id="fscanmsg">Starting the camera…</p><div class="c"><button class="tx" data-a="fscanstop">Cancel</button></div>`;
 const v=$('#fvid'),say=t=>{const m=$('#fscanmsg');if(m)m.textContent=t},cam={video:{facingMode:{ideal:'environment'}},audio:false};
 const done=code=>{if(tok!=scanTok)return;stopScan();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}const i=$('#fbc');if(i)i.value=code;box.innerHTML='';foodBarcode()};
 try{
  if(window.BarcodeDetector&&BarcodeDetector.getSupportedFormats){const fm=await BarcodeDetector.getSupportedFormats();
   if(fm.includes('ean_13')){const st=await navigator.mediaDevices.getUserMedia(cam);if(tok!=scanTok){st.getTracks().forEach(t=>t.stop());return}
    v.srcObject=st;await v.play();const det=new BarcodeDetector({formats:fm.filter(f=>/ean|upc/.test(f))});let alive=true;scanCtl={stop(){alive=false;st.getTracks().forEach(t=>t.stop())}};say('Point the camera at the barcode.');
    const tick=async()=>{if(!alive)return;try{const r=await det.detect(v);if(r.length)return done(r[0].rawValue)}catch(e){}setTimeout(tick,150)};tick();return}}
  say('Loading the scanner…');await loadZX();if(tok!=scanTok)return;
  const rd=new ZXingBrowser.BrowserMultiFormatOneDReader(),c=await rd.decodeFromConstraints(cam,v,res=>{if(res)done(res.getText())});
  if(tok!=scanTok){c.stop();return}scanCtl=c;say('Point the camera at the barcode. Hold it steady and fill the frame.')
 }catch(e){if(tok!=scanTok)return;stopScan();box.innerHTML=`<p class="warn">${e&&e.name=='NotAllowedError'?'Camera access was blocked. In Safari, tap aA in the address bar, then Website Settings, and allow the camera. Or type the barcode below.':e&&e.message=='load'?'Could not load the scanner. Check your connection, or type the barcode below.':'Could not start the camera. Type the barcode below instead.'}</p>`}}

 const band=pr.map((p,i)=>X(xs[i])+','+Y(p[2])).concat(pr.map((p,i)=>X(xs[i])+','+Y(p[1])).reverse()).join(' ');
