<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>SetOrder</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#15171a;--mute:#797b7f;--line:#e8e5dc;--soft:#f0ede4;--acc:#c9f23a;--on:#15171a;--tb:#15171a;--tf:#9a9c94;--sh:0 1px 2px rgba(30,28,10,.05),0 10px 30px rgba(30,28,10,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f0d;--card:#181915;--ink:#f4f3ed;--mute:#8d8e87;--line:#282923;--soft:#21221d;--tb:#2a2b26;--tf:#8d8e87;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{background:var(--bg);touch-action:pan-x pan-y;overscroll-behavior-x:none}
body{margin:0;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 150px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;margin-bottom:20px;position:relative;z-index:3}
.brand i{width:16px;height:16px;border-radius:5px;background:var(--acc);box-shadow:inset 0 0 0 3px var(--ink)}
.signout-top{background:var(--soft);color:var(--ink);border:0;border-radius:12px;padding:6px 12px;font-family:inherit;font-size:.76rem;font-weight:700;cursor:pointer;margin-left:6px}
.signout-top:active{transform:scale(.97)}
.view-stage{position:relative;overflow-x:clip;min-height:60vh}
.view-pane{width:100%;background:var(--bg);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.view-pane.out{position:absolute;top:0;left:0;right:0;pointer-events:none}

@media (prefers-color-scheme:dark){.view-pane.top-shadow{box-shadow:-14px 0 34px rgba(0,0,0,.45)}}
h1{font-size:2.7rem;font-weight:800;letter-spacing:-.045em;line-height:1;margin:0}
h2{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h3{margin:0;font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.m{color:var(--mute);font-size:.88rem;margin:6px 0 0}.warn{color:#d2481f;font-size:.88rem;margin:10px 0 0}.good{color:#4d7a00;font-size:.88rem;margin:10px 0 0}.c{text-align:center}
@media (prefers-color-scheme:dark){.good{color:var(--acc)}}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
@media (prefers-color-scheme:dark){.card,.ex,.dc{border:1px solid var(--line)}}
.hero{background:var(--ink);color:var(--bg)}.hero .eyebrow,.hero .m{color:inherit;opacity:.65}
.bar{height:8px;background:rgba(128,128,128,.3);border-radius:4px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.nav2{display:flex;gap:8px}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 16px}
.dc{border:0;background:var(--card);border-radius:16px;padding:9px 0 9px;font-family:inherit;color:var(--mute);font-size:.7rem;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.dc b{display:block;font-size:1.05rem;color:var(--ink);margin:2px 0 5px;font-weight:700}
.dc i{display:block;width:5px;height:5px;border-radius:50%;margin:0 auto}.dc i.w{background:var(--mute);opacity:.5}.dc i.d{background:var(--acc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

.btn{display:flex;align-items:center;justify-content:center;width:100%;background:var(--acc);color:var(--on);border:0;border-radius:18px;padding:15px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:14px}
.btn:active{transform:scale(.985)}.btn.dark{background:var(--ink);color:var(--bg)}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:#d2481f;color:#fff}
.tx{background:none;border:0;color:var(--mute);font-family:inherit;font-weight:600;font-size:.85rem;padding:6px 0;cursor:pointer}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fuel{display:flex;align-items:baseline;gap:8px}.fuel b{font-size:3.1rem;font-weight:800;letter-spacing:-.045em;line-height:1}.fuel span{color:var(--mute);font-weight:600}

.stage{display:inline-block;background:var(--acc);color:var(--on);border-radius:10px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-bottom:10px}
.fld{margin-top:16px}.fl{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;margin-bottom:7px;gap:8px}.fl em{font-style:normal;color:var(--mute);font-weight:500;text-align:right}
.sl{display:flex;gap:12px;align-items:center}.sl input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}.sl input[type=number]{width:88px;flex:none;text-align:center}
input[type=number],input[type=text],input[type=password],input[type=email],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:0;border-radius:14px;padding:12px 14px;width:100%}

input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}

.step{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:18px;padding:4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}

.rowsw:last-child{border-bottom:0}
.tg{width:46px;height:28px;border-radius:14px;background:var(--soft);position:relative;flex:none;transition:.15s;box-shadow:inset 0 0 0 1px var(--line)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(18px);background:#15171a}
.ex{background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);border:2px solid transparent}
.ex.act{border-color:var(--acc)}.ex.done{opacity:.55}.ex.done:has(.sp.ed){opacity:1}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

button.sp{border:0;font-family:inherit;cursor:pointer}
.sp.ed{outline:2px solid var(--ink);outline-offset:2px}
.sp.o{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute)}
.edit{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tags span{background:var(--soft);border-radius:10px;padding:4px 10px;font-size:.8rem;font-weight:600}
.rx{font-size:1.15rem;font-weight:600;margin:8px 0 0;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:9px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}.ch{width:100%;height:auto;display:block}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}.kv div:last-child{border:0}.kv span{color:var(--mute)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),420px);display:grid;grid-template-columns:repeat(4,1fr);background:var(--tb);border-radius:28px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:5;touch-action:none}
.tab-pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);background:var(--acc);border-radius:22px;transform-origin:50% 50%;will-change:transform;pointer-events:none;z-index:0}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--tf);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:22px;font-family:inherit;cursor:pointer;transition:color .26s ease,transform .22s ease;touch-action:none}
.tabs button.on{color:var(--on)}.tabs.scrubbing button.on{transform:scale(1.06)}.tabs em{font-style:normal;font-size:.68rem;font-weight:700}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),420px);background:var(--acc);color:var(--on);border-radius:20px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;z-index:6;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#rest[hidden]{display:none}#rest b{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}#rest span{flex:1;font-size:.85rem;font-weight:600;line-height:1.2}
#rest button{background:var(--on);color:var(--acc);border:0;border-radius:12px;padding:8px 12px;font-family:inherit;font-weight:700;cursor:pointer}
.auth{max-width:380px;margin:0 auto;padding:calc(8vh + env(safe-area-inset-top,0px)) 20px 40px}
.auth .seg{margin:20px 0 14px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;margin-bottom:26px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--acc);box-shadow:inset 0 0 0 4px var(--ink)}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800;text-transform:uppercase}
.swr{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:end}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" hidden><b id="rt"></b><span id="rn"></span><button data-a="add30">+30s</button><button data-a="skip">Skip</button></div>
<script>

let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
 if(e.target&&/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;
 const now=Date.now();
 if(now-lastTouchEnd<=300)e.preventDefault();
 lastTouchEnd=now;
},{passive:false});

// ---------- Exercise library ----------
const LAD={

uni:['Single leg','Reverse lunge|bw|8|12|0|75|0','Bulgarian split squat|bw|8|12|0|90|0','DB Bulgarian split squat|db|8|12|2|120|.2','Smith split squat|sm|8|12|2.5|120|.35'],

ham:['Hamstrings','Slider leg curl|bw|6|12|0|75|0','Leg curl machine|lm|10|15|2.5|90|.4','Nordic curl|bw|3|8|0|120|0'],
calf:['Calves','Calf raise|bw|15|30|0|45|0','Single-leg calf raise|bw|10|20|0|45|0','DB calf raise|db|10|15|2|60|.3','Smith calf raise|sm|10|15|5|60|.6','Leg press calf raise|lp|12|20|5|60|.8','Calf machine|lm|10|15|5|60|.9'],

const SES={
'Upper A':[['push_h',3],['pull_h',3],['push_v',3],['fly',2],['side',2],['tri',3]],
'Lower A':[['squat',3],['hinge',3],['ham',3],['calf',3],['core',2]],
'Upper B':[['pull_v',3],['push_i',3],['dips',2],['rear',3],['bi',3],['traps',2]],
'Lower B':[['uni',3],['glute',3],['quad',3],['ham',2],['core',2]]};
const SPLIT=Object.keys(SES),LOWER=new Set(['squat','hinge','glute','uni','quad','ham','calf']);
const EQ={db:'Dumbbells',bb:'Barbell and squat rack',sm:'Smith machine',cb:'Cable machine',mc:'Chest, shoulder and row machines',lp:'Leg press',lm:'Leg curl and extension machines',bar:'Pull-up bar',dip:'Dip station',lat:'Lat pulldown'};
const CARDIO=['Rowing erg','Running','Cycling','Swimming','Ski erg','Incline walk','Elliptical'];
const CMET={'Rowing erg':7,'Running':9.8,'Cycling':7.5,'Swimming':8,'Ski erg':8,'Incline walk':5,'Elliptical':5};
const NM=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ORD=[1,2,3,4,5,6,0],DL='SMTWTFS';
const TABS=['day','plan','prog','me'];
const DS={pal:1.6,sc:2,fc:2,setAU:20,actAdd:.5,rest:1,sports:'Rowing erg, 7\nRunning, 9.8\nCycling, 7.5\nSwimming, 8\nSki erg, 8\nIncline walk, 5\nElliptical, 5\nUltimate, 8\nTennis, 7\nOther, 5'};
const lad=p=>LAD[p].slice(1).map(s=>{const[n,eq,lo,hi,step,rest,ratio]=s.split('|');return{n,eq,lo:+lo,hi:+hi,step:+step,rest:+rest,ratio:+ratio}});

// ---------- Helpers ----------
const $=s=>document.querySelector(s),z=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()),pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dn=s=>Math.round(pd(s)/864e5),fromN=n=>ymd(new Date(n*864e5+12*36e5)),TODAY=ymd(new Date());
const f=(n,k=1)=>n==null||isNaN(n)?'–':n.toFixed(k),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,rnd=(x,s)=>Math.round(x/s)*s,cap=s=>s[0].toUpperCase()+s.slice(1);
const nv=id=>{const v=parseFloat(($('#'+id)||{}).value);return isNaN(v)?null:v};
const ps=x=>{const[a,b]=String(x).trim().split(':');return b!=null?(+a)*60+(+b):+a};
const mmss=s=>{if(s==null)return'–';const r=Math.round(s);return Math.floor(r/60)+':'+z(r%60)};
const fdate=(d,o)=>pd(d).toLocaleDateString('en-GB',o);

// Elastic capsule morph (solid accent pill, no liquid glass, unhurried 500ms settle)
function morphPill(pill,fromPos,toIdx,startSx=1,startSy=1){
 if(!pill)return;
 if(pillAnim){try{pillAnim.cancel()}catch(e){}pillAnim=null}
 const endTf=`translate3d(${toIdx*100}%,0,0) scale3d(1,1,1)`;
 if((Math.abs(fromPos-toIdx)<0.001&&Math.abs(startSx-1)<0.001)||fromPos<0||!pill.animate){
  pill.style.transform=endTf;
  return;
 }
 const right=toIdx>=fromPos,dist=toIdx-fromPos,steps=32,frames=[];
 for(let i=0;i<=steps;i++){
  const u=i/steps;
  const lead=u>=1?1:1-Math.exp(-6.2*u)*Math.cos(3.3*u);
  const td=u<=.16?0:(u-.16)/.84;
  const trail=u>=1?1:td<=0?0:1-Math.exp(-5.6*td)*Math.cos(2.6*td);
  const L=fromPos+dist*(right?trail:lead);
  const R=fromPos+1+dist*(right?lead:trail);
  const stretchW=Math.max(.9,R-L);
  const easeOut=Math.pow(1-u,3);
  const w=stretchW+(startSx-1)*easeOut;
  const stretchSy=1-Math.min(.14,Math.max(0,(w-1)*.17));
  const sy=stretchSy+(startSy-1)*easeOut;
  frames.push({transform:`translate3d(${(L*100).toFixed(2)}%,0,0) scale3d(${w.toFixed(4)},${sy.toFixed(4)},1)`});
 }
 pill.style.transform=endTf;
 pillAnim=pill.animate(frames,{duration:500,easing:'linear'});
 pillAnim.onfinish=()=>{pillAnim=null};
}

let scrub={active:false,dragging:false,pid:null,startX:0,startY:0,pos:0,sx:1,sy:1,lastX:0,lastT:0,holdTimer:null};
let suppressClickUntil=0;

function bindTabScrub(){
 const nav=$('.tabs');
 if(!nav||nav.dataset.bound)return;
 nav.dataset.bound='1';

 const getMetrics=()=>{
  const r=nav.getBoundingClientRect();
  const pad=6;
  const slotW=Math.max(1,(r.width-pad*2)/4);
  return{left:r.left+pad,slotW};
 };

 const posFromX=clientX=>{
  const{left,slotW}=getMetrics();
  return Math.max(0,Math.min(3,(clientX-left-slotW/2)/slotW));
 };

 const applyVisual=(pos,sx,sy)=>{
  const pill=$('.tab-pill');
  if(pill){
   if(pillAnim){try{pillAnim.cancel()}catch(e){}pillAnim=null}
   pill.style.transform=`translate3d(${(pos*100).toFixed(2)}%,0,0) scale3d(${sx.toFixed(4)},${sy.toFixed(4)},1)`;
  }
  const hoverIdx=Math.max(0,Math.min(3,Math.round(pos)));
  nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===hoverIdx));
  return hoverIdx;
 };

 const engageDrag=(clientX)=>{
  if(scrub.dragging)return;
  scrub.dragging=true;
  nav.classList.add('scrubbing');
  const curIdx=Math.max(0,TABS.indexOf(tab));
  scrub.pos=curIdx;
  scrub.sx=1.06;
  scrub.sy=1.06;
  applyVisual(scrub.pos,scrub.sx,scrub.sy);
  try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
  if(clientX!=null)updateDrag(clientX);
 };

 const updateDrag=(clientX)=>{
  const now=performance.now();
  const dt=Math.max(8,now-scrub.lastT);
  const{slotW}=getMetrics();
  const vx=((clientX-scrub.lastX)/slotW)/(dt/1000);
  scrub.lastX=clientX;
  scrub.lastT=now;

  const targetPos=posFromX(clientX);
  scrub.pos=targetPos;
  const stretch=Math.min(.26,Math.abs(vx)*.028);
  scrub.sx=1.06+stretch;
  scrub.sy=1.06-stretch*.42;

  const hoverIdx=applyVisual(scrub.pos,scrub.sx,scrub.sy);
  const targetTab=TABS[hoverIdx];
  if(targetTab&&targetTab!==tab){
   try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
   switchTab(targetTab,true);
  }
 };

 nav.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  clearTimeout(scrub.holdTimer);
  const curIdx=Math.max(0,TABS.indexOf(tab));
  scrub={
   active:true,
   dragging:false,
   pid:e.pointerId,
   startX:e.clientX,
   startY:e.clientY,
   pos:curIdx,
   sx:1,
   sy:1,
   lastX:e.clientX,
   lastT:performance.now(),
   holdTimer:setTimeout(()=>engageDrag(e.clientX),130)
  };
  try{nav.setPointerCapture(e.pointerId)}catch(err){}
  // Subtle immediate press feedback
  const pill=$('.tab-pill');
  if(pill&&!pillAnim){
   pill.style.transform=`translate3d(${curIdx*100}%,0,0) scale3d(0.95,0.95,1)`;
  }
 });

 nav.addEventListener('pointermove',e=>{
  if(!scrub.active||e.pointerId!==scrub.pid)return;
  if(!scrub.dragging){
   if(Math.hypot(e.clientX-scrub.startX,e.clientY-scrub.startY)>7){
    clearTimeout(scrub.holdTimer);
    engageDrag(e.clientX);
   }
   return;
  }
  e.preventDefault();
  updateDrag(e.clientX);
 });

 const finishScrub=e=>{
  if(!scrub.active||(e&&e.pointerId!==scrub.pid))return;
  clearTimeout(scrub.holdTimer);
  try{nav.releasePointerCapture(scrub.pid)}catch(err){}
  const wasDragging=scrub.dragging;
  const fromPos=scrub.pos;
  const fromSx=scrub.sx;
  const fromSy=scrub.sy;
  scrub.active=false;
  scrub.dragging=false;
  nav.classList.remove('scrubbing');

  if(wasDragging){
   suppressClickUntil=Date.now()+350;
   const finalIdx=Math.max(0,Math.min(3,Math.round(fromPos)));
   const finalTab=TABS[finalIdx];
   if(finalTab!==tab){
    switchTab(finalTab,true);
   }
   morphPill($('.tab-pill'),fromPos,finalIdx,fromSx,fromSy);
  }
 };

 nav.addEventListener('pointerup',finishScrub);
 nav.addEventListener('pointercancel',finishScrub);
}

function switchTab(nextTab,fromScrub=false){
 if(tab===nextTab&&!sub){
  if(!fromScrub){
   const idx=Math.max(0,TABS.indexOf(tab));
   const pill=$('.tab-pill');
   if(pill&&!pillAnim)pill.style.transform=`translate3d(${idx*100}%,0,0) scale3d(1,1,1)`;
  }
  return;
 }
 tab=nextTab;
 sub=null;wmsg='';gmsg='';swmsg='';amsg='';es=null;wcarry=null;
 window.scrollTo(0,0);
 render(fromScrub);
}

function shell(h,fromScrub=false){
 const app=$('#app'),idx=Math.max(0,TABS.indexOf(tab));
 let stage=$('.view-stage');
 if(!stage){
  app.innerHTML=`<div class="wrap"><div class="brand"><i></i>SetOrder<span id="sync" style="margin-left:auto;font-weight:600;font-size:.72rem;color:var(--mute)"></span><button class="signout-top" data-a="out" type="button">Sign out</button></div><div class="view-stage"><div class="view-pane">${h}</div></div></div><nav class="tabs"><div class="tab-pill" style="transform:translate3d(${idx*100}%,0,0)"></div>${[['day','Today',I.today],['plan','Plan',I.plan],['prog','Progress',I.prog],['me','Me',I.me]].map(([k,l,i])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${i}<em>${l}</em></button>`).join('')}</nav>`;
  renderedTab=tab;
  bindTabScrub();
  updSync();
  return;
 }

 const oldIdx=TABS.indexOf(renderedTab);
 const changed=renderedTab!==null&&renderedTab!==tab;
 document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===idx));

 if(!fromScrub){
  if(changed)morphPill($('.tab-pill'),oldIdx,idx);
  else{
   const pill=$('.tab-pill');
   if(pill&&!pillAnim)pill.style.transform=`translate3d(${idx*100}%,0,0) scale3d(1,1,1)`;
  }
 }

 if(slideCleanup){slideCleanup();slideCleanup=null}
 stage.querySelectorAll('.view-pane.out').forEach(el=>el.remove());

 const oldPane=stage.querySelector('.view-pane');
 const newPane=document.createElement('div');
 newPane.className='view-pane';
 newPane.innerHTML=h;

 if(changed&&oldPane){
  const dir=idx>oldIdx?1:-1;
  oldPane.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  oldPane.classList.add('out');
  oldPane.style.opacity='1';
  newPane.style.opacity='1';

  if(dir>0){
   oldPane.style.zIndex='1';
   newPane.style.zIndex='2';
   newPane.classList.add('top-shadow');
   newPane.style.transform='translate3d(100%,0,0)';
   oldPane.style.transform='translate3d(0,0,0)';
  }else{
   oldPane.style.zIndex='2';
   oldPane.classList.add('top-shadow');
   newPane.style.zIndex='1';
   newPane.style.transform='translate3d(-26%,0,0)';
   oldPane.style.transform='translate3d(0,0,0)';
  }

  stage.appendChild(newPane);

  const ease='cubic-bezier(0.22, 1, 0.36, 1)';
  const dur=520;
  let a1=null,a2=null;

  if(newPane.animate&&oldPane.animate){
   a1=newPane.animate([
    {transform:dir>0?'translate3d(100%,0,0)':'translate3d(-26%,0,0)'},
    {transform:'translate3d(0,0,0)'}
   ],{duration:dur,easing:ease,fill:'forwards'});
   a2=oldPane.animate([
    {transform:'translate3d(0,0,0)'},
    {transform:dir>0?'translate3d(-26%,0,0)':'translate3d(100%,0,0)'}
   ],{duration:dur,easing:ease,fill:'forwards'});
  }

  const finish=()=>{
   if(a1){try{a1.cancel()}catch(e){}}
   if(a2){try{a2.cancel()}catch(e){}}
   oldPane.remove();
   newPane.classList.remove('top-shadow');
   newPane.style.transform='';
   newPane.style.opacity='';
   newPane.style.zIndex='';
   slideCleanup=null;
  };

  const tid=setTimeout(finish,dur+20);
  slideCleanup=()=>{clearTimeout(tid);finish()};
 }else{
  stage.innerHTML='';
  stage.appendChild(newPane);
 }

 renderedTab=tab;
 bindTabScrub();
 updSync();
}

 <div class="card"><div class="eyebrow">Account</div><p class="m" style="margin-top:0">Signed in as ${esc(email)}. Your data is saved to your account in the cloud.</p>
 <div class="fld"><div class="fl"><span>Display name</span></div><input type="text" id="nun" maxlength="30" value="${esc(dname)}" autocomplete="off"><button class="btn ghost" data-a="chun" style="margin-top:10px">Change name</button></div>
 <div class="fld"><div class="fl"><span>Change password</span></div><input type="password" id="cpw" placeholder="Current password" autocomplete="current-password"><div style="height:8px"></div><input type="password" id="npw" placeholder="New password (6 or more characters)" autocomplete="new-password"><button class="btn ghost" data-a="chpw" style="margin-top:10px">Change password</button></div>
 ${amsg?`<p class="${aok?'good':'warn'}">${esc(amsg)}</p>`:''}
 <button class="btn dark" data-a="out" style="margin-top:16px">Sign out</button>
 <div style="margin-top:10px"><button class="tx" data-a="reset">Erase my logged data</button></div>
 <div class="fld"><div class="fl"><span>Delete account</span><em>removes the account and all its data</em></div><input type="password" id="dpw" placeholder="Enter your password" autocomplete="current-password"><button class="btn danger" data-a="delacct" style="margin-top:10px">Delete account</button></div></div>`,fromScrub)}

function render(fromScrub=false){if(booting)return loadV();if(bootErr)return errV();if(!U)return authV();if(!U.ready)return setupV();if(sub=='form')return formV();({day:dayV,plan:planV,prog:progV,me:meV})[tab](fromScrub)}

// ---------- Events ----------
function addCardio(t){const days=[6,0,3,2,4,5,1];for(const i of days){const c={type:t,n:1,days:[i]};U.cardio.push(c);if(restFree())return true;U.cardio.pop()}return false}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.tab){if(Date.now()<suppressClickUntil)return;switchTab(D.tab,false);return}
 if(D.day){vd=D.day;tab='day';sub=null;rest=null;swapP=null;es=null;wcarry=null;return render()}
 if(D.st){const i=$('#'+D.st);i.value=Math.max(0,+((parseFloat(i.value)||0)+parseFloat(D.dl)).toFixed(2));return}
 if(D.wi){const[n,v,t]=D.wi.split('|');U.winc=U.winc||{};U.winc[n]=+v;save();const wi=$('#'+t),ri=$('#'+(t=='iw'?'ir':'er'));wcarry={n,t,v:wi?wi.value:'',r:ri?ri.value:''};return wk()}
 if(D.mode){mode=D.mode;msg='';return render()}
 if(D.wd!=null){const i=+D.wd;U.wd[i]=U.wd[i]?0:1;wmsg='';if(!restFree()){U.wd[i]=0;wmsg='Keep at least one full rest day a week.'}save();return render()}
 if(D.cd){wmsg='';const k=U.cardio.findIndex(c=>c.type==D.cd);if(k>=0)U.cardio.splice(k,1);else if(!addCardio(D.cd))wmsg='Keep at least one full rest day a week.';save();return render()}
 if(D.cn){const[t,n]=D.cn.split('|'),c=U.cardio.find(x=>x.type==t);if(c){c.n=+n;c.days=c.days.slice(0,c.n);if(!c.days.length&&!addDay(c))wmsg='Keep at least one full rest day a week.';save()}return render()}
 if(D.cday){const[t,i]=D.cday.split('|'),c=U.cardio.find(x=>x.type==t),d=+i;if(c){wmsg='';if(c.days.includes(d))c.days=c.days.filter(x=>x!=d);else{c.days.push(d);if(c.days.length>c.n)c.days.shift()}if(!restFree()){c.days=c.days.filter(x=>x!=d);wmsg='Keep at least one full rest day a week.'}save()}return render()}
 if(D.eq){U.eq[D.eq]=U.eq[D.eq]?0:1;if(!U.sets.length)U.lvl={};save();return render()}
 if(D.exp){U.base.exp=+D.exp;if(!U.sets.length)U.lvl={};save();return render()}
 const a=D.a;
 if(a=='auth')auth();else if(a=='forgot')forgot();else if(a=='retry')location.reload();
 else if(a=='log')logSet(D.p,+D.ns);else if(a=='swap'){swapP=swapP==D.p?null:D.p;wk()}
 else if(a=='editset'){es=es==+D.si?null:+D.si;wcarry=null;wk()}
 else if(a=='saveset')saveSet();
 else if(a=='cancelset'){es=null;wcarry=null;wk()}
 else if(a=='delset'){if(es!=null&&U.sets[es]){U.sets.splice(es,1);save()}es=null;wcarry=null;rest=null;wk()}
 else if(a=='undo'){const k=U.sets.map(s=>s.d).lastIndexOf(vd);if(k>=0){U.sets.splice(k,1);save();rest=null;es=null;wk()}}
 else if(a=='skip')rest=null;else if(a=='add30'&&rest){rest.end=Math.max(rest.end,Date.now())+30000;rest.b=0}
 else if(a=='fed'){sd(vd,{fed:!gd(vd).fed});b.querySelector('.tg').classList.toggle('on',!!gd(vd).fed);refreshDay()}
 else if(a=='afed'){fa=Object.assign({},fa);fa.fed=!fa.fed;$('#afedtg').classList.toggle('on',!!fa.fed)}
 else if(a=='toggle'){U.ov[vd]=isW(vd)?'rest':'work';save();render()}
 else if(a=='body'){sd(vd,{w:nv('lw'),kcal:nv('lk'),p:nv('lp_')});render()}
 else if(a=='savegoal'){saveGoal();render()}
 else if(a=='ready'){U.start=$('#start').value||TODAY;U.date=fromN(dn(U.start)+182);if(nv('gw')!=null&&nv('gbf')!=null&&!U.goal)saveGoal();U.ready=1;save();vd=U.start>TODAY?U.start:TODAY;tab='day';gmsg='';render()}
 else if(a=='rxlog'){const c=U.cardio.find(x=>x.type==D.c),x=cardioRx(c,vd);draft={type:c.type,min:x.min,rpe:x.rpe,rx:x.rpe,dist:x.len&&x.kind=='r'?x.reps*x.len:null,note:x.n+': '+rxText(x),fed:!!gd(vd).fed};fa=draft;editId=null;sub='form';render()}
 else if(a=='newact'){fa={type:(U.cardio[0]||{}).type||'Running',min:30,rpe:6,fed:!!gd(vd).fed};editId=null;sub='form';render()}
 else if(a=='edit'){editId=+D.i;fa=Object.assign({},U.acts.find(x=>x.id==editId));sub='form';render()}
 else if(a=='cancel'){sub=null;fa=null;draft=null;render()}
 else if(a=='del'){U.acts=U.acts.filter(x=>x.id!=D.i);save();render()}
 else if(a=='saveact'){readForm();const o=Object.assign({},fa,{id:editId||Date.now(),d:vd,fed:!!fa.fed,rx:fa.rx||null});
  const k=U.acts.findIndex(x=>x.id==o.id);k>=0?U.acts[k]=o:U.acts.push(o);save();sub=null;editId=null;fa=null;draft=null;render()}
 else if(a=='chun')chUn();
 else if(a=='chpw')chPw();
 else if(a=='delacct')delAcct();
 else if(a=='out')logout();
 else if(a=='reset'&&confirm('Erase all your logged data? Your account stays.')){U=newU();save();tab='plan';render()}});
function addDay(c){for(const i of [6,0,3,2,4,5,1]){c.days=[i];if(restFree())return true}c.days=[];return false}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.p)document.querySelectorAll('[data-p="'+t.dataset.p+'"]').forEach(x=>{if(x!==t)x.value=t.value})});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset,i=t.id,v=parseFloat(t.value);
 if(d.lift){lift=t.value;render()}
 else if(d.s){U.set[d.s]=isNaN(v)?DS[d.s]:v;save()}
 else if(d.b){if(d.b=='s2k')U.base.s2k=t.value.trim();else U.base[d.b]=isNaN(v)?null:v;save();const el=$('#bst');if(el)el.innerHTML=bstats()}
 else if(d.f=='sleep'){sd(vd,{sleep:isNaN(v)?null:v});refreshDay()}
 else if(d.sp){U.set.sports=t.value;save()}
 else if(d.sw!==undefined){const nm=d.sw,ex=Object.keys(LAD).flatMap(lad).find(x=>x.n==nm);swmsg='';
  if(isNaN(v)||v<=0){delete U.sw[nm]}else if(ex){const mx=Math.max(ex.step*4,(ex.ratio||.3)*bw()*2.5),val=Math.min(v,mx);if(v>mx){swmsg=`${nm}: ${v} kg is more than a realistic start, so it was set to ${rnd(mx,.5)} kg. You can raise it as you progress.`}U.sw[nm]=rnd(val,.5)}
  save();render()}
 else if(i=='atype'){readForm();formV()}
 else if(d.p2){U.lvl[d.p2]=+t.value;swapP=null;save();render()}
 else if(i=='start'&&t.value){U.start=t.value;if(U.ready){save();render()}}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='un'||e.target.id=='pw'||e.target.id=='dn'))auth()});
render();
setTimeout(()=>{if(booting&&!window.FB){booting=false;bootErr='Could not load Firebase. Check your connection and reload.';render()}},10000);
</script>
